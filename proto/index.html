<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Proto</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<div class="aero-app">
  <div class="aero-body">
    <div class="aero-toolbox" id="tools"></div>
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd"></div>
      <div class="aero-work" style="grid-template-columns:244px 1fr 288px">
        <div class="aero-side left">
          <div class="aero-tabs" id="ltabs"><div class="aero-tab on" data-tab="layers">Layers</div><div class="aero-tab" data-tab="assets">Assets</div><div class="aero-tab" data-tab="history">History</div><div class="aero-tab" data-tab="comments" title="Review comments">Comments</div></div>
          <div class="aero-list" id="layers"></div>
          <div class="aero-list" id="assets" hidden></div>
          <div class="aero-list" id="history" hidden></div>
          <div class="aero-list" id="comments" hidden></div>
        </div>
        <div class="aero-stage" id="stage"></div>
        <div class="aero-side">
          <div class="aero-tabs" id="rtabs"><div class="aero-tab on" data-mode="design">Design</div><div class="aero-tab" data-mode="proto">Prototype</div><div class="aero-tab" data-mode="inspect">Inspect</div></div>
          <div id="insp"></div>
        </div>
      </div>
      <div class="aero-status"><span id="st-mode">Design</span><span id="st-sel"></span><span id="st-zoom">100%</span><span id="st-pos"></span></div>
    </div>
  </div>
</div>
<script src="vendor/fflate.min.js"></script>
<script src="vendor/paper-core.min.js"></script>
<script src="../kit/aero.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/player.js"></script>
<script src="js/editor.js"></script>
<script src="js/guides.js"></script>
<script src="js/a11y.js"></script>
<script src="js/actions.js"></script>
<script src="js/fxstyles.js"></script>
<script src="js/codegen.js"></script>
<script src="js/panels.js"></script>
<script src="js/comments.js"></script>
<script src="js/io.js"></script>
<script src="js/ttf.js"></script>
<script src="js/pdf.js"></script>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body></html>
