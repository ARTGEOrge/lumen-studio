<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Studio</title>
<link rel="stylesheet" href="../kit/aero.css">
<style>
.hub{display:grid;grid-template-columns:190px 1fr;min-height:0}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav .aero-item{font-size:13px;padding:6px 10px}
.nav .foot{margin-top:auto;padding:8px 10px;color:var(--dim);font-size:11px;line-height:1.5}
.main{overflow-y:auto;padding:20px 24px 28px;background:linear-gradient(#fff,#f3f7fc)}
.main h1{margin:0;font:300 26px var(--font);color:var(--navy)}
.main .sub{margin:2px 0 18px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid #c5d5e8;border-radius:6px;background:#fff;transition:box-shadow .15s}
.card:hover{border-color:var(--hov-border);background:linear-gradient(var(--hov-top),var(--hov-bot));box-shadow:0 2px 8px rgba(30,60,100,.15)}
.card img{width:56px;height:56px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.card h2{margin:0;font:600 14px var(--font)}
.card .like{font-size:11px;color:#1d7a2a;background:#e6f6e3;border:1px solid #b9e2b0;border-radius:3px;padding:0 5px;margin-left:4px;font-weight:400}
.card p{margin:3px 0 10px;color:var(--dim);font-size:12px;line-height:1.4}
.card .btns{display:flex;gap:6px}
.card .aero-btn{min-width:0}
.card.missing{opacity:.5}
</style>
</head><body>
<div class="aero-app">
  <div class="aero-body no-toolbox">
    <div class="aero-client" style="grid-template-rows:1fr auto">
      <div class="hub">
        <div class="aero-side left">
          <div class="nav">
            <div class="aero-item sel">🧩 All apps</div>
            <div class="aero-item" data-f="photo">🖼️ Photo &amp; design</div>
            <div class="aero-item" data-f="video">🎬 Video &amp; audio</div>
            <div class="aero-item" data-f="docs">📄 Documents</div>
            <div class="foot">Lumen Studio — free creative apps.<br>Everything runs on your PC; nothing is uploaded.</div>
          </div>
        </div>
        <div class="main">
          <h1>Lumen Studio</h1>
          <div class="sub">Pick an app to start, or open a file with it.</div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="aero-status"><span id="st">Ready</span></div>
    </div>
  </div>
</div>
<script src="../kit/aero.js"></script>
<script>
const CATS = { photo: ['photo', 'vector', 'darkroom', 'paint', 'proto'], video: ['cut', 'motion', 'sound'], docs: ['layout', 'pdf'] };
let apps = [], filter = null;
Aero.init({ name: 'Lumen Studio', icon: '../kit/icons/lumen.png',
  menus: { File: [['Exit', 'Alt+F4', () => window.desktop ? desktop.win('close') : Aero.toast('Close the tab to exit')]],
           Help: [['About Lumen Studio', '', () => Aero.alert('Lumen Studio', 'Free creative apps in the spirit of Adobe\'s — photo, vector, painting, video, motion, audio, layout, prototyping and PDF.')]] } });
function render() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  apps.filter(a => !filter || CATS[filter].includes(a.id)).forEach(a => {
    const c = Aero.el('div', 'card' + (a.available === false ? ' missing' : ''),
      `<img src="../kit/icons/${a.id}.png" alt=""><div><h2>${Aero.esc(a.name)}<span class="like">like ${Aero.esc(a.like)}</span></h2><p>${Aero.esc(a.desc)}</p><div class="btns"><button class="aero-btn pri" data-a="open">Open</button><button class="aero-btn" data-a="file">Open file…</button></div></div>`);
    c.querySelector('[data-a=open]').onclick = () => launch(a, false);
    c.querySelector('[data-a=file]').onclick = () => launch(a, true);
    c.ondblclick = e => { if (!e.target.closest('button')) launch(a, false); };
    g.appendChild(c);
  });
}
function launch(a, pick) {
  if (a.available === false) return Aero.toast(a.name + ' is not installed in this build');
  if (window.desktop?.openApp) { desktop.openApp(a.id, pick); document.getElementById('st').textContent = 'Opening ' + a.name + '…'; }
  else location.href = '../' + a.id + '/';
}
document.querySelectorAll('.nav .aero-item').forEach(n => n.onclick = () => {
  document.querySelectorAll('.nav .aero-item').forEach(x => x.classList.toggle('sel', x === n)); filter = n.dataset.f || null; render();
});
(window.desktop?.apps ? desktop.apps() : fetch('../apps.json').then(r => r.json()).catch(() => [])).then(list => { apps = list; render(); });
</script>
</body></html>
