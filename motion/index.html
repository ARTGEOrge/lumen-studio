<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Motion</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset=".5" stop-color="#3a8fe0"/><stop offset="1" stop-color="#1c5fb4"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f28a"/><stop offset=".5" stop-color="#4cb82c"/><stop offset="1" stop-color="#2a7f14"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8a"/><stop offset=".5" stop-color="#e0402c"/><stop offset="1" stop-color="#a81c10"/></linearGradient>
    <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8e4f0"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#e3a21a"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c4ff"/><stop offset="1" stop-color="#7b3fd0"/></linearGradient>
  </defs>
</svg>
<div class="aero-app">
  <div class="aero-body">
    <div class="aero-toolbox" id="tools"></div>
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd"></div>
      <div class="aero-work" id="work">
        <div id="top">
          <div class="aero-side left" id="leftpanel">
            <div class="aero-ph"><span class="phi" style="background:linear-gradient(#ffe9a0,#e3a21a)"></span>Project<span class="right" id="projcount"></span></div>
            <div class="aero-list" id="project"></div>
            <div class="aero-iconbar" id="projbtns"></div>
            <div class="aero-ph"><span class="phi" style="background:linear-gradient(#e2c4ff,#7b3fd0)"></span>Effects &amp; Presets</div>
            <div class="aero-tabs" id="fxtabs"><div class="aero-tab on" data-t="fx">Effects</div><div class="aero-tab" data-t="presets">Animation Presets</div></div>
            <div id="fxsearch"><input type="search" id="fxq" placeholder="Search effects…" spellcheck="false"></div>
            <div class="aero-list" id="fxlist"></div>
          </div>
          <div class="aero-stage" id="stage">
            <div id="viewport"><canvas id="view"></canvas><canvas id="overlay"></canvas></div>
            <div class="aero-pill" id="viewbar"></div>
            <div id="welcome" hidden></div>
          </div>
          <div class="aero-side" id="rightpanel">
            <div class="aero-ph"><span class="phi"></span>Properties<span class="right" id="propname"></span></div>
            <div id="inspector"></div>
            <div class="aero-ph"><span class="phi" style="background:linear-gradient(#b8f28a,#2a7f14)"></span>History<span class="right" id="histinfo"></span></div>
            <div class="aero-list" id="history"></div>
          </div>
        </div>
        <div id="splitter" title="Drag to resize the timeline"></div>
        <div id="timeline"></div>
      </div>
      <div class="aero-status"><span id="st-comp"></span><span id="st-time"></span><span id="st-fps"></span><span id="st-cache"></span><span id="st-expr"></span><span id="st-msg"></span></div>
    </div>
  </div>
</div>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/webm-muxer.js"></script>
<script src="vendor/fflate.js"></script>
<script src="../kit/aero.js"></script>
<script src="js/expr.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/widgets.js"></script>
<script src="js/viewer.js"></script>
<script src="js/timeline.js"></script>
<script src="js/graph.js"></script>
<script src="js/panels.js"></script>
<script src="js/io.js"></script>
<script src="js/sample.js"></script>
<script src="js/menus.js"></script>
</body></html>
