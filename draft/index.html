<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Draft</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<div class="aero-app">
  <div class="aero-body">
    <div class="aero-toolbox" id="tools"></div>
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd">
        <span class="grp" id="propBar">
          <label title="Current layer (applies to the selection when objects are selected)">Layer <select id="layerSel"></select></label>
          <label title="Colour">Color <select id="colorSel"></select></label>
          <label title="Linetype">Linetype <select id="ltSel"></select></label>
          <label title="Lineweight">Lineweight <select id="lwSel"></select></label>
        </span>
        <span class="grp" id="layoutBar" hidden>
          <label>Paper <select id="paperSel"></select></label>
          <label>Scale <select id="scaleSel"></select></label>
          <button class="aero-btn" id="bFit" title="Pick the largest standard scale that fits and centre the drawing">Fit drawing</button>
          <button class="aero-btn" id="bPage">Title block…</button>
          <button class="aero-btn pri" id="bPlot" title="Export PDF or SVG (Ctrl+P)">Plot…</button>
        </span>
        <span class="hint" id="hint"></span>
      </div>
      <div class="aero-work" style="grid-template-columns:1fr 268px">
        <div class="draft-main">
          <div class="aero-stage draft-stage" id="stage">
            <canvas id="cv"></canvas><canvas id="ov"></canvas>
            <div class="welcome" id="welcome" hidden>
              <div class="wbox">
                <h2>Lumen Draft</h2>
                <p>Precise 2-D drafting in real units. Type a command (<b>LINE</b>, <b>CIRCLE</b>, <b>TRIM</b>…) or pick a tool on the left, then enter points with the mouse or as coordinates — <code>100,50</code>, <code>@25,0</code>, <code>@40&lt;30</code>.</p>
                <div class="wbtns"><button class="aero-btn pri" id="wSample">Open sample drawing</button><button class="aero-btn" id="wOpen">Open DXF / .ldraft…</button><button class="aero-btn" id="wStart">Start drawing</button></div>
              </div>
            </div>
          </div>
          <div class="cmdline" id="cmdline">
            <div class="cmdhist" id="cmdhist"></div>
            <div class="cmdrow"><span class="cmdicon">›_</span><span class="prompt" id="prompt">Command:</span><input id="cmdIn" spellcheck="false" autocomplete="off"><div class="suggest" id="suggest" hidden></div></div>
          </div>
        </div>
        <div class="aero-side">
          <div class="aero-ph"><span class="phi"></span><span id="propTitle">Properties</span><span class="right" id="propCount"></span></div>
          <div class="aero-pane props" id="props"></div>
          <div class="aero-ph"><span class="phi"></span>Layers<span class="right" id="layerCount"></span></div>
          <div class="aero-list layers" id="layers"></div>
          <div class="aero-iconbar">
            <button class="aero-iconbtn" id="lNew" title="New layer">＋</button>
            <button class="aero-iconbtn" id="lCur" title="Make the selected object's layer current">✓</button>
            <button class="aero-iconbtn" id="lEdit" title="Layer properties…">✎</button>
            <button class="aero-iconbtn" id="lDel" title="Delete layer (must be empty)">✕</button>
          </div>
        </div>
      </div>
      <div class="aero-status draft-status">
        <span class="tabs" id="spaceTabs"><button class="stab on" data-s="model">Model</button><button class="stab" data-s="layout">Layout1</button></span>
        <span id="coords" class="mono">0.0000, 0.0000</span>
        <span class="toggles" id="toggles"></span>
        <span id="st1" class="grow">Ready</span>
        <span id="st2"></span>
      </div>
    </div>
  </div>
</div>
<script src="../kit/aero.js"></script>
<script src="js/geom.js"></script><script src="js/model.js"></script><script src="js/dxf.js"></script><script src="js/export.js"></script><script src="js/sample.js"></script>
<script src="js/view.js"></script><script src="js/cmds.js"></script><script src="js/app.js"></script>
</body></html>
