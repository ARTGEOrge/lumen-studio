<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Flow</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<div class="aero-app">
  <div class="aero-body no-toolbox">
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd">
        <label>Case <select id="caseSel"></select></label>
        <span class="sep"></span>
        <button class="aero-btn pri" id="bRun">▶ Run</button><button class="aero-btn" id="bStep" title="One time step">Step</button><button class="aero-btn" id="bReset">⟲ Reset</button>
        <span class="sep"></span>
        <label>Show <select id="field"><option value="speed">Speed</option><option value="p">Pressure</option><option value="vort">Vorticity</option><option value="dye">Dye streaks</option><option value="u">u (x-velocity)</option><option value="v">v (y-velocity)</option></select></label>
        <label><input type="checkbox" id="stream" checked> Streamlines</label><label><input type="checkbox" id="vecs"> Arrows</label>
        <span class="sep"></span>
        <button class="aero-btn" id="bPaint" title="Paint obstacles with the mouse">✎ Draw</button><button class="aero-btn" id="bErase" title="Erase obstacles">⌫ Erase</button>
        <span class="hint" id="hint"></span>
      </div>
      <div class="aero-work" style="grid-template-columns:1fr 300px">
        <div class="aero-stage flow-stage" id="stage"><canvas id="cv"></canvas></div>
        <div class="aero-side">
          <div class="aero-ph"><span class="phi"></span>Case setup</div>
          <div class="aero-pane setup" id="setup"></div>
          <div class="aero-ph"><span class="phi"></span>Results<span class="right" id="clock"></span></div>
          <div class="aero-pane" id="results"></div>
          <div class="aero-tabs" id="ctabs"><span class="aero-tab on" data-c="forces">Forces</span><span class="aero-tab" data-c="conv">Convergence</span><span class="aero-tab" data-c="valid">Validation</span></div>
          <canvas id="chart" class="chart"></canvas>
        </div>
      </div>
      <div class="aero-status"><span id="st1">Ready</span><span id="st2"></span><span id="st3"></span></div>
    </div>
  </div>
</div>
<script src="../kit/aero.js"></script>
<script src="js/solver.js"></script><script src="js/cases.js"></script><script src="js/app.js"></script>
</body></html>
