<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Spice</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<div class="aero-app">
  <div class="aero-body">
    <div class="aero-toolbox" id="tools"></div>
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd">
        <button class="aero-btn pri" id="bRun" title="Run simulation (F5)"><svg viewBox="0 0 16 16" width="12" height="12"><path d="M3 2l11 6-11 6z" fill="#1f7a2e"/></svg> Run</button>
        <button class="aero-btn" id="bStop" title="Stop the running simulation" disabled>Stop</button>
        <span class="sep"></span>
        <label>Analysis <select id="simType"><option value="tran">Transient</option><option value="ac">AC sweep</option><option value="dc">DC sweep</option><option value="op">Operating point</option></select></label>
        <input type="text" id="simCard" class="mono" spellcheck="false" title="SPICE analysis command — edit directly or use Edit…">
        <button class="aero-btn" id="bSim" title="Edit the simulation command (Ctrl+T)">Edit…</button>
        <span class="sep"></span>
        <button class="aero-btn icon" id="bRot" title="Rotate (Ctrl+R)">⟳</button><button class="aero-btn icon" id="bMir" title="Mirror (Ctrl+E)">⇋</button>
        <span class="sep"></span>
        <button class="aero-btn" id="bC1" title="Cursor 1 (1)">Cursor 1</button><button class="aero-btn" id="bC2" title="Cursor 2 (2)">Cursor 2</button><button class="aero-btn" id="bFitPlot" title="Fit the plot (double-click the plot)">Fit plot</button>
        <span class="hint" id="hint"></span>
      </div>
      <div class="aero-work" style="grid-template-columns:1fr 300px">
        <div class="split" id="split">
          <div class="aero-stage sch-stage" id="stage"><canvas id="cv"></canvas><textarea id="netText" class="code" spellcheck="false" hidden></textarea></div>
          <div class="splitter" id="splitter" title="Drag to resize"></div>
          <div class="plot-pane" id="plotPane"><canvas id="pcv"></canvas><div class="progress" id="progress" hidden><div></div></div></div>
        </div>
        <div class="aero-side">
          <div class="aero-ph"><span class="phi"></span><span id="propTitle">Properties</span></div>
          <div class="aero-pane" id="props"></div>
          <div class="aero-tabs" id="tabs"><div class="aero-tab on" data-t="traces">Traces</div><div class="aero-tab" data-t="signals">Signals</div><div class="aero-tab" data-t="output">Output</div><div class="aero-tab" data-t="dir">Directives</div></div>
          <div class="tabbody" id="tab-traces"><div class="aero-list" id="traceList"></div><div class="aero-pane readout" id="readout"></div></div>
          <div class="tabbody" id="tab-signals" hidden><div class="aero-pane" style="padding-bottom:4px"><input type="search" id="sigSearch" placeholder="Filter signals…"></div><div class="aero-list" id="sigList"></div></div>
          <div class="tabbody" id="tab-output" hidden><div class="aero-list" id="outList"></div></div>
          <div class="tabbody" id="tab-dir" hidden><div class="aero-pane dirpane"><div class="dim small">SPICE directives added to the netlist (.model, .param, .subckt, .options, .ic, K coupling):</div><textarea id="dirText" class="code" spellcheck="false" placeholder=".model DX D(IS=1e-14 N=1.8)&#10;.param R=4.7k"></textarea></div></div>
        </div>
      </div>
      <div class="aero-status"><span id="st1">Ready</span><span id="st2"></span><span id="st3"></span><span id="stZoom"></span></div>
    </div>
  </div>
</div>
<script src="../kit/aero.js"></script>
<script src="js/expr.js"></script><script src="js/models.js"></script><script src="js/netlist.js"></script><script src="js/engine.js"></script>
<script src="js/parts.js"></script><script src="js/schematic.js"></script><script src="js/sample.js"></script>
<script src="js/editor.js"></script><script src="js/plot.js"></script><script src="js/app.js"></script>
</body></html>
