<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Beats</title>
<link rel="stylesheet" href="../kit/aero.css"><link rel="stylesheet" href="app.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset=".5" stop-color="#3a8fe0"/><stop offset="1" stop-color="#1c5fb4"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f28a"/><stop offset=".5" stop-color="#4cb82c"/><stop offset="1" stop-color="#2a7f14"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8a"/><stop offset=".5" stop-color="#e0402c"/><stop offset="1" stop-color="#a81c10"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#e3a21a"/></linearGradient>
</defs></svg>
<div class="aero-app">
  <div class="aero-body">
    <div class="aero-toolbox" id="tools"></div>
    <div class="aero-client">
      <div class="aero-cmdbar" id="cmd"></div>
      <div class="aero-work" style="grid-template-columns:1fr 292px">
        <div class="aero-stage" id="stage">
          <section id="pl" class="pane pl-pane">
            <div class="pane-head"><span class="phi"></span><b>Playlist</b><span class="dim" id="pl-info"></span><span class="grow"></span>
              <button class="aero-btn small" id="pl-addtrack" title="Add a playlist track">+ Track</button>
              <button class="aero-btn small" id="pl-addauto" title="Add an automation lane">+ Automation</button>
              <button class="aero-btn small" id="pl-loop" title="Loop region: drag on the ruler with Shift (or right button); double-click the ruler to clear">Loop off</button>
            </div>
            <div class="pl-body">
              <div class="picker"><div class="picker-h">Patterns <button class="mini" id="pk-add" title="New pattern (F4)">+</button></div><div class="aero-list" id="picker"></div></div>
              <div class="pl-main" id="pl-main"></div>
            </div>
          </section>
          <div class="split" id="split" title="Drag to resize"></div>
          <section id="ed" class="pane ed-pane">
            <div class="aero-tabs ed-tabs" id="ed-tabs">
              <div class="aero-tab on" data-v="rack">Channel Rack</div><div class="aero-tab" data-v="roll">Piano Roll</div><div class="aero-tab" data-v="mixer">Mixer</div>
              <span class="grow"></span><span class="ed-info dim" id="ed-info"></span>
            </div>
            <div class="ed-view" id="v-rack"></div>
            <div class="ed-view" id="v-roll" hidden></div>
            <div class="ed-view" id="v-mixer" hidden></div>
          </section>
        </div>
        <div class="aero-side" id="side">
          <div class="aero-tabs" id="side-tabs"><div class="aero-tab on" data-tab="inst">Instrument</div><div class="aero-tab" data-tab="fx">Effects</div></div>
          <div class="side-scroll" id="side-inst"></div>
          <div class="side-scroll" id="side-fx" hidden></div>
          <div class="aero-ph"><span class="phi" style="background:linear-gradient(#ffe9a0,#e3a21a)"></span>History<span class="right" id="histinfo"></span></div>
          <div class="aero-list" id="hist"></div>
        </div>
      </div>
      <div class="aero-status"><span id="st-tool"></span><span id="st-prj"></span><span id="st-pos"></span><span id="st-audio"></span><span id="st-midi"></span><span id="st-hover"></span></div>
    </div>
  </div>
</div>
<script src="vendor/lamejs.js"></script>
<script src="../kit/aero.js"></script>
<script src="js/core.js"></script>
<script src="js/midi.js"></script>
<script src="js/wav.js"></script>
<script src="js/synth.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/rack.js"></script>
<script src="js/roll.js"></script>
<script src="js/playlist.js"></script>
<script src="js/mixer.js"></script>
<script src="js/side.js"></script>
<script src="js/app.js"></script>
</body></html>
